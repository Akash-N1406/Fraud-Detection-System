{% extends "dashboard/base.html" %}
{% block nav_home %}active{% endblock %}
{% block content %}
<div class="kpi-grid" id="kpi-grid"></div>
<div class="chart-grid">
    <div class="chart-box">
        <h3>Fraud by Transaction Type</h3><canvas id="chart-type"></canvas>
    </div>
    <div class="chart-box">
        <h3>Risk Score Distribution</h3><canvas id="chart-risk"></canvas>
    </div>
    <div class="chart-box">
        <h3>Hourly Fraud Pattern</h3><canvas id="chart-hourly"></canvas>
    </div>
    <div class="chart-box">
        <h3>Transaction Amount Distribution</h3><canvas id="chart-amount"></canvas>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function api(path) {
        const res = await fetch(path, { credentials: "same-origin" });
        if (!res.ok) throw new Error(`${path} -> ${res.status}`);
        return res.json();
    }

    const COLORS = { blue: "#3b82f6", green: "#4ade80", yellow: "#facc15", orange: "#fb923c", red: "#f87171" };

    function baseChartOptions() {
        return {
            plugins: { legend: { labels: { color: "#94a3b8" } } },
            scales: {
                x: { ticks: { color: "#94a3b8" }, grid: { color: "#334155" } },
                y: { ticks: { color: "#94a3b8" }, grid: { color: "#334155" } },
            },
        };
    }

    async function loadKPIs() {
        const kpis = await api("/api/dashboard/kpis/");
        const grid = document.getElementById("kpi-grid");
        const cards = [
            ["Total Transactions", kpis.total_transactions.toLocaleString()],
            ["Fraud Detected", kpis.total_fraud_detected.toLocaleString()],
            ["Detection Rate", (kpis.fraud_detection_rate * 100).toFixed(2) + "%"],
            ["High Risk Transactions", kpis.high_risk_transactions.toLocaleString()],
            ["Avg Transaction Amount", "$" + kpis.average_transaction_amount.toLocaleString()],
        ];
        grid.innerHTML = cards.map(([label, value]) =>
            `<div class="kpi-card"><div class="label">${label}</div><div class="value">${value}</div></div>`
        ).join("");
    }

    async function loadFraudByType() {
        const data = await api("/api/dashboard/fraud-by-type/");
        new Chart(document.getElementById("chart-type"), {
            type: "bar",
            data: {
                labels: data.map(d => d.type),
                datasets: [
                    { label: "Total", data: data.map(d => d.total), backgroundColor: COLORS.blue },
                    { label: "Fraud", data: data.map(d => d.fraud), backgroundColor: COLORS.red },
                ],
            },
            options: baseChartOptions(),
        });
    }

    async function loadRiskDistribution() {
        const data = await api("/api/dashboard/risk-distribution/");
        const order = ["Low", "Medium", "High", "Critical"];
        const colorMap = { Low: COLORS.green, Medium: COLORS.yellow, High: COLORS.orange, Critical: COLORS.red };
        const sorted = order.map(level => data.find(d => d.risk_level === level) || { risk_level: level, count: 0 });
        new Chart(document.getElementById("chart-risk"), {
            type: "doughnut",
            data: {
                labels: sorted.map(d => d.risk_level),
                datasets: [{ data: sorted.map(d => d.count), backgroundColor: sorted.map(d => colorMap[d.risk_level]) }],
            },
            options: { plugins: { legend: { labels: { color: "#94a3b8" } } } },
        });
    }

    async function loadHourlyPattern() {
        const data = await api("/api/dashboard/hourly-pattern/");
        new Chart(document.getElementById("chart-hourly"), {
            type: "line",
            data: {
                labels: data.map(d => d.hour + ":00"),
                datasets: [
                    { label: "Total", data: data.map(d => d.total), borderColor: COLORS.blue, tension: 0.3 },
                    { label: "Fraud", data: data.map(d => d.fraud), borderColor: COLORS.red, tension: 0.3 },
                ],
            },
            options: baseChartOptions(),
        });
    }

    async function loadAmountDistribution() {
        const data = await api("/api/dashboard/amount-distribution/");
        new Chart(document.getElementById("chart-amount"), {
            type: "bar",
            data: {
                labels: data.map(d => d.bucket),
                datasets: [{ label: "Transactions", data: data.map(d => d.count), backgroundColor: COLORS.blue }],
            },
            options: baseChartOptions(),
        });
    }

    loadKPIs();
    loadFraudByType();
    loadRiskDistribution();
    loadHourlyPattern();
    loadAmountDistribution();
</script>
{% endblock %}
