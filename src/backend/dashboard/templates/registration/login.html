<!DOCTYPE html>
<html>

<head>
    <title>Login — Fraud Detection System</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: #1e293b;
            padding: 2rem;
            border-radius: 8px;
            width: 320px;
        }

        h1 {
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
        }

        input {
            width: 100%;
            padding: 0.5rem;
            margin-bottom: 1rem;
            border-radius: 4px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #e2e8f0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 0.6rem;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }

        .errorlist {
            color: #f87171;
            font-size: 0.85rem;
            list-style: none;
            padding: 0;
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>Fraud Detection System</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.errors }}
            <input type="text" name="username" placeholder="Username" required autofocus>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Log in</button>
        </form>
    </div>
</body>

</html>
